server:
  port: 8082

spring:
  application:
    name: meeting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeting_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

services:
  signaling-service:
    url: ${SIGNALING_SERVICE_URL:http://localhost:8083}
