server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Meet-Clone-Identity-Service}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:2108@Das}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.meetclone.identity: INFO
    org.apache.tomcat.util.http.parser.Cookie: OFF
    org.hibernate: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-must-be-at-least-256-bits-long}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  oauth2:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/auth/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:166975802292-gmle331v0b6cm7p8ss0f395pl2ebk0fv.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET: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}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/auth/oauth/google/callback}
